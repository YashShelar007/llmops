services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    # Load local .env (gitignored) so LANGFUSE_* and others are available
    env_file:
      - ../.env
    environment:
      # App defaults; secrets still come from .env
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      TIMEOUT_SECONDS: ${TIMEOUT_SECONDS:-8}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      METRICS_LOG: /data/metrics.jsonl
    volumes:
      - ../data:/data
    restart: unless-stopped
