<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LLMOps Starter UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          sans-serif;
        margin: 24px;
      }
      .card {
        max-width: 800px;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 16px;
      }
      textarea {
        width: 100%;
        height: 120px;
      }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #ccc;
        cursor: pointer;
      }
      pre {
        background: #111;
        color: #eee;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>LLMOps Starter — Demo</h2>
      <p>
        Enter a prompt and call the FastAPI backend. Shows answer, latency, and
        trace ID.
      </p>
      <textarea id="query" placeholder="Ask something..."></textarea>
      <div class="row">
        <button id="send">Send</button>
        <span id="status"></span>
      </div>
      <h3>Response</h3>
      <pre id="out">(waiting)</pre>
    </div>

    <script>
      const out = document.getElementById("out");
      const statusEl = document.getElementById("status");
      document.getElementById("send").onclick = async () => {
        const query = document.getElementById("query").value.trim();
        if (!query) {
          alert("Please enter a query.");
          return;
        }

        statusEl.textContent = "Calling /answer...";
        out.textContent = "(waiting)";
        try {
          const res = await fetch("http://localhost:8000/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query }),
          });
          const json = await res.json();
          statusEl.textContent = res.ok ? "OK" : `Error ${res.status}`;
          out.textContent = JSON.stringify(json, null, 2);
        } catch (e) {
          statusEl.textContent = "Network error";
          out.textContent = String(e);
        }
      };
    </script>
  </body>
</html>
