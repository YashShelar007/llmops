<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LLMOps Starter UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          sans-serif;
        margin: 24px;
      }
      .card {
        max-width: 800px;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 16px;
      }
      textarea {
        width: 100%;
        height: 120px;
      }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #ccc;
        cursor: pointer;
      }
      pre {
        background: #111;
        color: #eee;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .muted {
        color: #666;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>LLMOps Starter — Demo</h2>
      <p>
        Enter a prompt and call the FastAPI backend. Shows answer, latency, and
        trace ID.
      </p>

      <p class="muted">
        Tip: You can open this UI directly at
        <code>http://localhost:8000/ui/index.html</code> (served by FastAPI) to
        avoid live-reload flicker.
      </p>

      <textarea id="query" placeholder="Ask something..."></textarea>
      <div class="row">
        <button id="send">Send</button>
        <span id="status"></span>
      </div>
      <h3>Response</h3>
      <pre id="out">(waiting)</pre>
    </div>

    <script>
      const API_BASE = "http://localhost:8000"; // same-origin if you use /ui
      const out = document.getElementById("out");
      const statusEl = document.getElementById("status");
      const qEl = document.getElementById("query");

      // Restore last response so a reload doesn't wipe it
      const LAST_KEY = "llmops-starter:last";
      const last = localStorage.getItem(LAST_KEY);
      if (last) {
        try {
          const obj = JSON.parse(last);
          if (obj.query) qEl.value = obj.query;
          if (obj.json) {
            out.textContent =
              JSON.stringify(obj.json, null, 2) +
              (obj.json?.trace?.guardrail
                ? `\n\n(guardrail: ${obj.json.trace.guardrail})`
                : "");
            statusEl.textContent = "restored";
          }
        } catch {}
      }

      document.getElementById("send").onclick = async () => {
        const query = qEl.value.trim();
        if (!query) {
          alert("Please enter a query.");
          return;
        }

        statusEl.textContent = "Calling /answer...";
        // Keep previous output visible; do not overwrite with (waiting)

        try {
          const res = await fetch(`${API_BASE}/answer`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query }),
          });
          const json = await res.json();
          statusEl.textContent = res.ok ? "OK" : `Error ${res.status}`;
          out.textContent =
            JSON.stringify(json, null, 2) +
            (json?.trace?.guardrail
              ? `\n\n(guardrail: ${json.trace.guardrail})`
              : "");
          // Persist so auto-reloads (if any) restore immediately
          localStorage.setItem(LAST_KEY, JSON.stringify({ query, json }));
        } catch (e) {
          statusEl.textContent = "Network error";
          out.textContent = String(e);
        }
      };
    </script>
  </body>
</html>
