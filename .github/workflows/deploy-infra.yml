name: deploy-infra
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy (defaults to sha-<commit>)"
        required: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPO: ${{ vars.ECR_REPO }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_TAG: ${{ inputs.image_tag || format('sha-{0}', github.sha) }}
  ARCH: x86_64

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform 1.5.7
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Resolve image digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST="$(aws ecr batch-get-image \
            --repository-name "${ECR_REPO}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'images[0].imageId.imageDigest' \
            --output text --region "${AWS_REGION}" || true)"

          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "None" ] || [ "${DIGEST}" = "null" ]; then
            echo "Tag ${IMAGE_TAG} not found; falling back to most recent tagged image..." >&2
            DIGEST="$(aws ecr describe-images \
              --repository-name "${ECR_REPO}" \
              --query "reverse(sort_by(imageDetails[?imageTags!=null], &imagePushedAt))[0].imageDigest" \
              --output text --region "${AWS_REGION}")"
          fi

          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "None" ] || [ "${DIGEST}" = "null" ]; then
            echo "Could not resolve any image digest to deploy." >&2
            exit 1
          fi

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "${DIGEST}" > image.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}@${{ steps.digest.outputs.digest }}
        run: |
          set -e
          terraform apply -auto-approve \
            -var "region=${{ env.AWS_REGION }}" \
            -var "image_uri=${IMAGE_URI}" \
            -var "architecture=${{ env.ARCH }}"
